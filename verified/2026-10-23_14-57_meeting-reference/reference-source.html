    if(b.hasAttribute('data-save-draft')){scene('overview');feedback('演示：草稿保存后返回总览；尚未生效任何状态决定');return;}
    if(b.hasAttribute('data-finalize')){gate();return;}
    if(b.dataset.gateField){var f=main.querySelector('[data-field="'+b.dataset.gateField+'"]');f.setAttribute('aria-invalid','true');f.focus();return;}
    if(b.hasAttribute('data-confirm-finalize')){state.phase='v0';scene('daily');feedback('演示：整份 V0 已定稿，安排从 24 号生效');return;}
    if(b.hasAttribute('data-change-arrangement')){
      modal('<h2>修改 2026-10-24 的安排</h2><p>原安排由例会 '+(state.phase==='v1final'?'V1':'V0')+' 确定，更正保留原决定与来源。</p><label class="ma-field"><span>修改为</span><select data-change-target><option>继续测试</option><option>测试暂停</option><option>测试转放量</option><option>测试淘汰</option></select></label><label class="ma-field"><span>修改理由<b class="ma-required">*</b></span><textarea data-change-reason placeholder="说明为什么需要更改例会决定"></textarea></label><p class="ma-error" data-reason-error hidden>请填写修改理由。</p><div class="ma-actions">'+btn('取消','data-close-modal')+btn('确认更正','data-save-change',true)+'</div>');return;
    }
    if(b.hasAttribute('data-save-change')){var reason=modalHost.querySelector('[data-change-reason]');if(!reason.value.trim()){modalHost.querySelector('[data-reason-error]').hidden=false;reason.setAttribute('aria-invalid','true');reason.focus();return;}state.override={target:modalHost.querySelector('[data-change-target]').value,reason:reason.value.trim()};modalHost.hidden=true;var values=Array.from(main.querySelectorAll('[data-daily]')).map(function(x){return x.value;});render();main.querySelectorAll('[data-daily]').forEach(function(x,i){x.value=values[i];});feedback('演示：已保存带理由的更正，原例会决定仍可追溯');return;}
    if(b.hasAttribute('data-non')){nonModal();return;}
    if(b.hasAttribute('data-save-non')){
      var skip=modalHost.querySelector('[data-non-mode]').value==='skip',error=modalHost.querySelector('[data-non-error]');
      if(skip&&!modalHost.querySelector('[data-non-reason]').value.trim()){error.hidden=false;error.textContent='请填写不复盘理由。';return;}
      if(!skip){var fields=Array.from(modalHost.querySelectorAll('[data-non-record] input,[data-non-record] textarea'));if(fields.some(function(x){return !x.value.trim()||!x.checkValidity();})){error.hidden=false;error.textContent='请补齐两项指标、数据截止日与结论；百分比应在 0%—100% 之间。';return;}}
      state.nonDone=true;state.nonSkipped=skip;modalHost.hidden=true;render();feedback(skip?'演示：非推广应处理节点已明确标记不复盘':'演示：非推广应处理节点已录入数据');return;
    }
    if(b.dataset.version){modal('<h2>上期周例会 · '+b.dataset.version+'</h2><p>这里展示对应版本冻结的数据、结论与决定。此记录为版式占位，不代表真实历史。</p><div class="ma-version-state"><strong>已定稿 '+b.dataset.version+'</strong><span>旧版本可查看，不被后续修订覆盖。</span></div><div class="ma-actions">'+btn('返回总览','data-close-modal',true)+'</div>');return;}
    if(b.hasAttribute('data-monthly')){feedback('月例会沿用同一结构；本次参考以周例会演示编辑流程');scene('cards');return;}
    if(b.hasAttribute('data-promotion-entry')){feedback('正式接入后前往推广专属入口，本参考不打开或改写网站');return;}
    if(b.hasAttribute('data-daily-save')){feedback('演示：保存真实指标；次日安排沿用已定稿决定，不重复填写');}
  });
  root.addEventListener('keydown',function(e){
    if(e.key==='Escape'){if(!modalHost.hidden){closeModal();e.preventDefault();}else if(!panelHost.hidden){closePanel(false);e.preventDefault();}}
    if(e.key==='Tab'&&(!modalHost.hidden||!panelHost.hidden)){var active=!modalHost.hidden?modalHost:panelHost;var focusables=Array.from(active.querySelectorAll('button,input,select,textarea')).filter(function(x){return !x.disabled&&!x.hidden&&x.getClientRects().length;});if(!focusables.length)return;var first=focusables[0],last=focusables[focusables.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}
  });
  window.addEventListener('openai:set_globals',function(e){var w=e.detail&&e.detail.globals&&e.detail.globals.widgetState;if(w&&w.modelContent&&w.modelContent.kind==='meeting-reference'&&w.modelContent.scene!==state.scene)scene(w.modelContent.scene);});
  render();
})();
</script>
