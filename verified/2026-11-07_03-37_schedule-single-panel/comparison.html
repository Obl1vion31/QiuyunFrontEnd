<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>排期 Inspector · 前后对比</title>
<style>*{box-sizing:border-box}body{margin:0;background:#edf3f7;color:#233848;font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif}header{padding:18px 24px;background:#fff;border-bottom:1px solid #d6e1e8}h1{margin:0;font-size:22px}p{margin:5px 0;color:#607689}nav{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:14px 24px;background:#f8fbfc}button,select,a.tool{font:inherit;min-height:38px;padding:8px 14px;border:1px solid #b7cbd9;border-radius:8px;background:#fff;color:#294d67}button{cursor:pointer}button[aria-pressed=true]{background:#245ad2;color:white;border-color:#245ad2}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #87b2ff;outline-offset:2px}a{color:#245ad2}label{display:flex;align-items:center;gap:8px}.viewport{height:calc(100vh - 205px);overflow:auto;padding:18px;text-align:center}.viewport img{display:block;height:auto;max-width:100%;margin:auto;border:1px solid #d6e2e9;box-shadow:0 8px 24px #274b6318}.viewport.original img{max-width:none}footer{padding:8px 24px;color:#657e90;background:#fff}.movies{padding:22px 24px;background:#fff}.movies video{display:block;max-width:100%;width:1000px;margin:16px 0}h2{font-size:18px}#image-meta{margin-left:auto}</style>
<header><h1>排期 Inspector · 前后对比</h1><p>同一隔离样本 · 原版79fe541 / 候选27245f9 · 只比较真实实现</p></header>
<nav aria-label="对比控制"><div><button id="before" aria-pressed="false">原版</button> <button id="after" aria-pressed="true">候选</button></div>
<label>状态<select id="state"><option value="published-detail">已发布详情</option><option value="unpublished-detail">未发布详情</option><option value="edit">编辑排期</option><option value="publication">发布登记</option><option value="revision">创建改帖</option><option value="calendar">原月历</option><option value="full">整页月历</option></select></label>
<label>桌面<select id="width"><option>1920</option><option selected>1440</option><option>1024</option></select></label>
<button id="scale" aria-pressed="false">原始尺寸</button><a id="original" class="tool" target="_blank" rel="noopener">打开PNG</a><a href="#movies">真实录像</a><a href="README.md">改动与验证</a><span id="image-meta"></span></nav>
<div class="viewport" id="viewport"><img id="shot" alt="同尺寸排期前后对比"></div>
<footer>切换版本保留滚动位置；可打开原图查看文字。图像使用虚构样本，正式页面见<a href="https://qiuyun-frontend.vercel.app/business/operations-schedule" target="_blank" rel="noopener">正式工作台</a>。</footer>
<section class="movies" id="movies"><h2>实际操作</h2><p>详情、编辑、发布登记与改帖同层往返，包含真实保存、失败保留和读取重试。</p><video controls preload="metadata" ><source src="media/interaction-1440.mp4" type="video/mp4"><source src="media/interaction-1440.webm" type="video/webm"></video><h2>深滚动返回</h2><video controls preload="metadata" ><source src="media/deep-scroll-1440.mp4" type="video/mp4"><source src="media/deep-scroll-1440.webm" type="video/webm"></video><p><a href="history/created-history-1440.png" target="_blank">建立排期摘要</a> · <a href="history/changed-history-1440.png" target="_blank">更正前后值</a></p></section>
<script>
let version='after';const shot=document.querySelector('#shot'),box=document.querySelector('#viewport'),state=document.querySelector('#state'),width=document.querySelector('#width');function update(){const x=box.scrollLeft,y=box.scrollTop;const file=state.value==='full'?version+'-calendar-full-'+width.value+'.png':version+'-admin-'+state.value+'-'+width.value+'.png';shot.src='screenshots/'+file;document.querySelector('#original').href=shot.src;document.querySelector('#image-meta').textContent=version==='before'?'原版':'候选';document.querySelector('#before').setAttribute('aria-pressed',String(version==='before'));document.querySelector('#after').setAttribute('aria-pressed',String(version==='after'));shot.onload=()=>{box.scrollLeft=x;box.scrollTop=y;};}
for(const key of['before','after'])document.querySelector('#'+key).onclick=()=>{version=key;update();};state.onchange=update;width.onchange=update;document.querySelector('#scale').onclick=e=>{const on=box.classList.toggle('original');e.currentTarget.setAttribute('aria-pressed',String(on));};update();
</script></html>
