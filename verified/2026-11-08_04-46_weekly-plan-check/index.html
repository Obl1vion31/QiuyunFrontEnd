<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>周会计划对照 · 实测截图</title><style>body{margin:0;background:#edf3f6;color:#1e3341;font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}header,nav{padding:16px 24px;background:#fff;border-bottom:1px solid #d9e4ea}h1{font-size:21px;margin:0}p{margin:8px 0}nav{display:flex;gap:16px;align-items:center;flex-wrap:wrap}label{display:flex;gap:8px;align-items:center}select,a{font:inherit}select{padding:6px;border:1px solid #bdcfda;border-radius:6px}a{color:#245cce}.view{padding:20px;text-align:center}.view img{max-width:100%;height:auto;background:#fff;box-shadow:0 8px 24px #29445418}footer{padding:16px 24px}</style><header><h1>周会计划对照 · 测试账号实测</h1><p>隔离样例：原计划5篇 → 调整后6篇 → 本周实发5篇；其中1篇跨期补发，仍有2篇待登记。</p></header><nav><label>账号<select id="role"><option value="admin">管理员</option><option value="employee">员工</option></select></label><label>桌面宽度<select id="width"><option>1920</option><option selected>1440</option><option>1024</option></select></label><label>截图<select id="state"><option value="table">计划明细</option><option value="reason" selected>展开调整原因</option><option value="expanded">完整桌面</option><option value="overview">汇总</option></select></label><a id="raw" target="_blank">打开原PNG</a><a href="README.md">测试说明</a></nav><div class="view"><img id="shot" alt="真实周会页面截图"></div><footer>全部为虚构测试资料，运行同一正式应用代码。1024明细可在原表格内左右滚动。</footer><script>const controls=['role','width','state'].map(id=>document.getElementById(id));function update(){const file=controls[0].value+'-weekly-'+controls[2].value+'-'+controls[1].value+'.png';const path='screenshots/'+file;document.getElementById('shot').src=path;document.getElementById('raw').href=path;}controls.forEach(el=>el.onchange=update);update();</script></html>
