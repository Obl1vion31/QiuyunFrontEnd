<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>例会 PDF 竖版对比</title><style>body{margin:0;background:#eaf0f4;color:#203340;font:15px/1.5 "Microsoft YaHei",sans-serif}header{padding:18px 24px;background:white;border-bottom:1px solid #cbd6df}h1{font-size:21px;margin:0 0 6px}nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,a{font:inherit}button{padding:7px 16px;border:1px solid #bccbd5;border-radius:7px;background:white;color:#234879;cursor:pointer}button.active{background:#285ecc;color:white}a{color:#2459bd}main{padding:18px 24px}img{display:block;width:100%;height:auto;background:white}.links{display:flex;gap:20px;margin:12px 0}.pdfs{display:grid;grid-template-columns:1fr 1fr;gap:16px}iframe{border:1px solid #cbd6df;width:100%;height:820px;background:white}p{margin:0;color:#596f7f}</style><header><h1>周／月例会 PDF · 竖版对比</h1><p>隔离测试样张 · 原版在左，竖版在右 · 可点击 PDF 放大查看</p><nav><button id="monthly" class="active" onclick="show('monthly')">月会</button><button id="weekly" onclick="show('weekly')">周会</button><a href="README.md">检查说明</a><a href="checks.json">检查记录</a></nav></header><main><div class="links"><a id="before-link" target="_blank">打开原横版 PDF</a><a id="after-link" target="_blank">打开竖版 PDF</a></div><img id="comparison"><div class="pdfs"><iframe id="before"></iframe><iframe id="after"></iframe></div></main><script>function show(kind){for(const v of ['monthly','weekly'])document.getElementById(v).classList.toggle('active',v===kind);for(const side of ['before','after']){let url='pdf/'+kind+'-'+side+'.pdf';document.getElementById(side).src=url;document.getElementById(side+'-link').href=url}document.getElementById('comparison').src='screenshots/'+kind+'-comparison.png'}show('monthly')</script>
